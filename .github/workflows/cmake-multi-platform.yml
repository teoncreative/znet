name: CMake on multiple platforms

on:
  push:
    branches: [ "main", "dev", "cpp14" ]
  pull_request:
    branches: [ "main", "dev", "cpp14" ]

jobs:
  build:
    # e.g. "ubuntu-latest / g++ / C++14"
    name: ${{ matrix.platform.os }} / ${{ matrix.platform.cpp_compiler }} / C++${{ matrix.cpp_standard }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false

      matrix:
        cpp_standard: [14, 17, 20, 23]
        build_type: [Release]
        platform:
          - { os: ubuntu-latest,  c_compiler: gcc,   cpp_compiler: g++ }
          - { os: ubuntu-latest,  c_compiler: clang, cpp_compiler: clang++ }
          - { os: windows-latest, c_compiler: cl,    cpp_compiler: cl }
          - { os: macos-latest,   c_compiler: clang, cpp_compiler: clang++ }

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.platform.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.platform.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DZNET_CXX_STANDARD=${{ matrix.cpp_standard }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  # cl above only exercises znet's MSVC warning set; clang on Windows takes the
  # GNU-style -W flags instead. Separate job: MSYS2 needs its own shell.
  build-msys2:
    name: windows-latest / msys2 clang / C++${{ matrix.cpp_standard }}
    runs-on: windows-latest

    defaults:
      run:
        shell: 'msys2 {0}'

    strategy:
      fail-fast: false
      matrix:
        cpp_standard: [14, 17, 20, 23]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: true
        pacboy: >-
          clang:p
          cmake:p
          ninja:p
          openssl:p

    # relative paths: the runner's backslashed paths are awkward in the MSYS2 shell
    - name: Configure CMake
      run: >
        cmake -B build -G Ninja
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_BUILD_TYPE=Release
        -DZNET_CXX_STANDARD=${{ matrix.cpp_standard }}
        -S .

    - name: Build
      run: cmake --build build

    - name: Test
      working-directory: build
      run: ctest --output-on-failure

  # OpenSSL ships with neither the NDK nor the iOS SDK, so vcpkg supplies it.
  build-mobile:
    name: ${{ matrix.target.name }} / C++${{ matrix.cpp_standard }}
    runs-on: ${{ matrix.target.os }}

    strategy:
      fail-fast: false
      matrix:
        cpp_standard: [14, 23]
        target:
          - name: android-arm64
            os: ubuntu-latest
            triplet: arm64-android
          - name: ios-arm64
            os: macos-latest
            triplet: arm64-ios

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Cache vcpkg binaries
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/vcpkg/archives
          ~/AppData/Local/vcpkg/archives
        key: vcpkg-${{ matrix.target.triplet }}-openssl

    # vcpkg's android triplet reads ANDROID_NDK_HOME; the runner only exports
    # ANDROID_NDK_LATEST_HOME, which is not visible to the ${{ env }} context.
    - name: Build OpenSSL for ${{ matrix.target.triplet }}
      run: |
        export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}"
        "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:${{ matrix.target.triplet }}

    - name: Configure CMake (android)
      if: matrix.target.name == 'android-arm64'
      run: >
        cmake -B build -G Ninja
        -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
        -DANDROID_ABI=arm64-v8a
        -DANDROID_PLATFORM=android-24
        -DCMAKE_BUILD_TYPE=Release
        -DZNET_CXX_STANDARD=${{ matrix.cpp_standard }}
        -DOPENSSL_ROOT_DIR=$VCPKG_INSTALLATION_ROOT/installed/${{ matrix.target.triplet }}
        -DCMAKE_FIND_ROOT_PATH=$VCPKG_INSTALLATION_ROOT/installed/${{ matrix.target.triplet }}
        -S .

    - name: Configure CMake (ios)
      if: matrix.target.name == 'ios-arm64'
      run: >
        cmake -B build -G Ninja
        -DCMAKE_SYSTEM_NAME=iOS
        -DCMAKE_OSX_ARCHITECTURES=arm64
        -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
        -DCMAKE_BUILD_TYPE=Release
        -DZNET_CXX_STANDARD=${{ matrix.cpp_standard }}
        -DOPENSSL_ROOT_DIR=$VCPKG_INSTALLATION_ROOT/installed/${{ matrix.target.triplet }}
        -DCMAKE_FIND_ROOT_PATH=$VCPKG_INSTALLATION_ROOT/installed/${{ matrix.target.triplet }}
        -S .

    - name: Build znet
      run: cmake --build build --target znet
