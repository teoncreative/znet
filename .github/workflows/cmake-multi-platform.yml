name: CMake on multiple platforms

on:
  push:
    branches: [ "main", "dev", "cpp14" ]
  pull_request:
    branches: [ "main", "dev", "cpp14" ]

jobs:
  build:
    # e.g. "ubuntu-latest / g++ / C++14"
    name: ${{ matrix.platform.os }} / ${{ matrix.platform.cpp_compiler }} / C++${{ matrix.cpp_standard }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false

      matrix:
        cpp_standard: [14, 17, 20, 23]
        build_type: [Release]
        platform:
          - { os: ubuntu-latest,  c_compiler: gcc,   cpp_compiler: g++ }
          - { os: ubuntu-latest,  c_compiler: clang, cpp_compiler: clang++ }
          - { os: windows-latest, c_compiler: cl,    cpp_compiler: cl }
          - { os: macos-latest,   c_compiler: clang, cpp_compiler: clang++ }

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.platform.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.platform.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DZNET_CXX_STANDARD=${{ matrix.cpp_standard }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

  # cl above only exercises znet's MSVC warning set; clang on Windows takes the
  # GNU-style -W flags instead. Separate job: MSYS2 needs its own shell.
  build-msys2:
    name: windows-latest / msys2 clang / C++${{ matrix.cpp_standard }}
    runs-on: windows-latest

    defaults:
      run:
        shell: 'msys2 {0}'

    strategy:
      fail-fast: false
      matrix:
        cpp_standard: [14, 17, 20, 23]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'

    - uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: true
        pacboy: >-
          clang:p
          cmake:p
          ninja:p
          openssl:p

    # relative paths: the runner's backslashed paths are awkward in the MSYS2 shell
    - name: Configure CMake
      run: >
        cmake -B build -G Ninja
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_BUILD_TYPE=Release
        -DZNET_CXX_STANDARD=${{ matrix.cpp_standard }}
        -S .

    - name: Build
      run: cmake --build build

    - name: Test
      working-directory: build
      run: ctest --output-on-failure
